services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: ${XYZW_API_IMAGE:-xyzw-web-helper-api:latest}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - xyzw-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: ${XYZW_WEB_IMAGE:-xyzw-web-helper-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
volumes:
  xyzw-data:
