map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    location = /_worker.js { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3001;
    }

    location = /ws {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location ^~ /api/hortor-ucenter/ {
        proxy_ssl_server_name on;
        proxy_set_header Host ucenter-app-server.hortorgames.com;
        proxy_set_header Content-Type "application/json; charset=utf-8";
        proxy_pass https://comb-platform.hortorgames.com/;
    }
    location ^~ /api/hortor/ {
        proxy_ssl_server_name on;
        proxy_set_header Content-Type "text/plain; charset=utf-8";
        proxy_set_header Origin https://open.weixin.qq.com;
        proxy_set_header Referer https://open.weixin.qq.com/;
        proxy_pass https://comb-platform.hortorgames.com/;
    }
    location ~ ^/api/(weixin|weixin-long)/ {
        resolver 127.0.0.11 valid=30s;
        set $wechat open.weixin.qq.com;
        if ($uri ~ "^/api/weixin-long/") { set $wechat long.open.weixin.qq.com; }
        rewrite ^/api/(weixin|weixin-long)(/.*)$ $2 break;
        proxy_ssl_server_name on;
        proxy_set_header Host $wechat;
        proxy_set_header Referer https://open.weixin.qq.com/;
        proxy_pass https://$wechat;
    }
}
