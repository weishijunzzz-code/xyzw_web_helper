name: '终极清理'

on:
  workflow_dispatch:  # 只有手动触发，不定时运行，避免反复消耗令牌

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 清理 7 天前的已完成工作流记录
        run: |
          # 使用你的个人 PAT 令牌进行最高权限操作
          GITHUB_TOKEN="${{ secrets.PAT }}"
          
          # 设置需要保留的时间（这里是7天），168小时 = 7*24
          # 获取当前仓库下所有状态为 completed 的运行记录ID
          RUN_IDS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=completed&per_page=100" \

            | jq -r '.workflow_runs[] | select(.updated_at < (now - 604800) | todate) | .id')

          if [ -z "$RUN_IDS" ]; then
            echo "✅ 没有超过 7 天的已完成记录需要清理。"
            exit 0
          fi

          # 循环删除找到的每一个 ID
          echo "开始批量清理..."
          for RUN_ID in $RUN_IDS; do
            echo "正在删除运行记录 #${RUN_ID}..."
            curl -X DELETE -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}"
          done
          echo "✅ 清理任务执行完毕！"