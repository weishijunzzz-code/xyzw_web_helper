name: '自动清理工作流记录'

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 运行 (北京时间 08:00)
  workflow_dispatch:  # 保留手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 清理 7 天前的已完成记录
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            async function cleanupWorkflowRuns() {
              // 1. 设置 7 天前的时间截点
              const cutoff = new Date();
              cutoff.setDate(cutoff.getDate() - 7);

              // 2. 获取当前工作流的 ID，避免把自己删了
              const { data: currentWorkflow } = await github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: context.workflow
              });
              const currentWorkflowId = currentWorkflow.id;

              let page = 1;
              const perPage = 100;
              let totalDeleted = 0;

              console.log(`开始清理，当前清理器工作流 ID: ${currentWorkflowId}`);

              // 3. 无限循环分页获取，直到页面为空自动停止
              while (true) {
                const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  status: 'completed',
                  per_page: perPage,
                  page: page
                });

                // 如果当前页面没有数据，说明全部删完了
                if (workflow_runs.length === 0) {
                  console.log("所有页面已处理完毕，清理结束。");
                  break;
                }

                for (const run of workflow_runs) {
                  // 过滤掉本清理器的工作流记录
                  if (run.workflow_id === currentWorkflowId) {
                    continue;
                  }

                  const runDate = new Date(run.created_at);
                  if (runDate < cutoff) {
                    try {
                      await github.rest.actions.deleteWorkflowRun({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: run.id
                      });
                      totalDeleted++;
                      console.log(`已删除: #${run.id} - ${run.name}`);
                    } catch (error) {
                      console.error(`删除 #${run.id} 时发生错误（可能是权限不足或正在运行中）: ${error.message}`);
                    }
                  }
                }
                page++;
                console.log(`正在获取下一页... (第 ${page} 页)`);
              }
            
              console.log(`清理任务完成！共计删除 ${totalDeleted} 条记录。`);
            }

            // 启动清理函数
            await cleanupWorkflowRuns();